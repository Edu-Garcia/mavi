services:
  web:
    build:
      context: .
      target: development
    command: npm run dev:web
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:3000
    env_file:
      - path: .env
        required: false

  api:
    build:
      context: .
      target: development
    command: npm run dev:api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - mavi-data:/app/data
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/mavi.db
    env_file:
      - path: .env
        required: false

volumes:
  mavi-data:
  node_modules:

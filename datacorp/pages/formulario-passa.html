<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datacorp — Formulário correto</title>
    <style>
      body {
        margin: 0;
        font-family: "Source Sans 3", system-ui, sans-serif;
        background: #f4f1ea;
        color: #1a1814;
        line-height: 1.6;
      }
      header {
        background: #0f4c5c;
        color: #fff;
        padding: 0.85rem 1.25rem;
      }
      header p {
        margin: 0;
        font-weight: 600;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
      }
      .field {
        margin: 0 0 1rem;
      }
      label {
        display: block;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        display: block;
        width: 100%;
        max-width: 24rem;
        box-sizing: border-box;
        margin-top: 0.35rem;
        padding: 0.65rem 0.75rem;
        font: inherit;
        color: #1a1814;
        background: #fff;
        border: 1px solid #1a1814;
        border-radius: 4px;
      }
      button {
        min-width: 44px;
        min-height: 44px;
        padding: 0.65rem 1.1rem;
        font: inherit;
        color: #fff;
        background: #0b5fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
        margin-top: 1.5rem;
        border: 1px solid #333;
        background: #fff;
      }
      a {
        color: #0b5fff;
      }
    </style>
  </head>
  <body>
    <header>
      <p>Levantamento Datacorp</p>
    </header>
    <main>
      <h1>Fale conosco</h1>
      <p>
        Versão que passa no critério de formulários. Cada campo tem
        <code>label</code> associado por <code>for</code>/<code>id</code>, e o
        botão de envio tem nome acessível.
      </p>

      <form action="#contato" method="get">
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" type="text" name="nome" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" name="email" autocomplete="email">
        </div>
        <div class="field">
          <label for="assunto">Assunto</label>
          <select id="assunto" name="assunto">
            <option value="">Escolha um assunto</option>
            <option>Dúvida sobre pedido</option>
            <option>Troca ou devolução</option>
          </select>
        </div>
        <div class="field">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="4"></textarea>
        </div>
        <button type="submit">Enviar mensagem</button>
      </form>

      <img
        src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='320'%20height='180'%3E%3Crect%20width='100%25'%20height='100%25'%20fill='%23e8eefc'/%3E%3Ctext%20x='50%25'%20y='50%25'%20dominant-baseline='middle'%20text-anchor='middle'%20fill='%231a1a1a'%20font-family='system-ui'%20font-size='20'%3EAtendimento%3C/text%3E%3C/svg%3E"
        alt="Balcão de atendimento da loja"
        width="320"
        height="180"
      >
      <p>
        <a href="https://example.com/ajuda">Central de ajuda</a>
      </p>
    </main>
  </body>
</html>
